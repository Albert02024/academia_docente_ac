{% extends "accounts/base.html" %}

{% block title %}Panel | {{ block.super }}{% endblock %}

{% block content %}
<h1 class="titulo">Panel</h1>

<p class="usuario-actual">
    Usuario: <strong>{{ user.username }}</strong>
</p>

<form method="post" action="{% url 'accounts:logout' %}" class="formulario">
    {% csrf_token %}
    <button type="submit" class="boton boton-secundario">Cerrar sesión</button>
</form>
{% endblock %}
